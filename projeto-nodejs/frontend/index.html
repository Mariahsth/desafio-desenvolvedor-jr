<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Gerenciador de Tarefas</h1>

        <div class="add-task">
            <label for="taskInput">Nova Tarefa:</label>
            <input type="text" id="taskInput" placeholder="Digite uma nova tarefa...">
            <label for="dueDateInput">Prazo de conclusão:</label>
            <input type="date" id="dueDateInput" title="Prazo da tarefa">
            <button onclick="addTask()">Adicionar</button>
        </div>

        <div class="task-list">
            <h2>Minhas Tarefas</h2>
            <div class="task-list">
                <h2>Ativas</h2>
                <ul id="tasksListActive"></ul>
            </div>
            
            <div class="task-list">
                <h2>Concluídas</h2>
                <ul id="tasksListCompleted"></ul>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
