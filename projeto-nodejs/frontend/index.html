<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body>
    <div class="container">
        <h1>Gerenciador de Tarefas</h1>

        <div class="add-task">
            <div class="input-group">
                <label for="taskInput">Nova Tarefa:</label>
                <input type="text" id="taskInput" placeholder="Ex: Estudar JavaScript..." class="input-full" />
            </div>
            <div class="input-group-inline">
                <div class="input-group">
                    <label for="dueDateInput">Prazo de conclusão:</label>
                    <input type="date" id="dueDateInput" title="Prazo da tarefa" />
                </div>
                <button type="button" class="btn-primary" onclick="addTask()">Adicionar</button>
            </div>
        </div>

        <div class="task-list-section">
            <div class="section-header">
                <h2>Ativas</h2>
                <button class="collapse-btn" >Recolher ▲</button>
            </div>
            <div id="section-active" class="section-content">
                <div class="filters">
                    <h3>Filtros de Pesquisa:</h3>
                    <div class="filter-controls">
                        <div class="input-group filter-date-group">
                            <label for="filterStart">Data início:</label>
                            <input type="date" id="filterStart" />
                        </div>
                        <div class="input-group filter-date-group">
                            <label for="filterEnd">Data fim:</label>
                            <input type="date" id="filterEnd" />
                        </div>
                        <div class="input-group filter-title-group">
                            <label for="searchTitle">Título:</label>
                            <input type="text" id="searchTitle" placeholder="Pesquisar por título..." />
                        </div>
                    </div>
                    <div class="filter-actions">
                        <button  class="btn-secondary">Aplicar filtros</button>
                        <button  class="btn-secondary">Limpar filtros</button>
                    </div>
                </div>

                <div class="tasks-scroll-wrapper">
                    <div class="task-header">
                        <div class="col-checkbox">Concluído</div>
                        <div class="col-title" id="sort-title">Título ▼</div>
                        <div class="col-due-date" id="sort-date">Prazo ▼</div>
                        <div class="col-status">Status</div>
                        <div class="col-actions">Ações</div>
                    </div>
                    <ul id="tasksListActive" class="tasks-list-ul"></ul>
                </div>
            </div>
        </div>

        <div class="task-list-section">
            <div class="section-header">
                <h2>Concluídas</h2>
                <button class="collapse-btn" >Recolher ▲</button>
            </div>
            <div id="section-completed" class="section-content">
                <div class="tasks-scroll-wrapper">
                    <div class="task-header">
                        <div class="col-checkbox">Concluído</div>
                        <div class="col-title">Título</div>
                        <div class="col-due-date">Prazo</div>
                        <div class="col-status">Status</div>
                        <div class="col-actions">Ações</div>
                    </div>
                    <ul id="tasksListCompleted" class="tasks-list-ul"></ul>
                </div>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <div id="confirmation-modal" class="modal hidden">
        <div class="modal-content">
            <h3>Confirmação de Exclusão</h3>
            <p>Tem certeza de que deseja <strong>excluir permanentemente</strong> esta tarefa?</p>
            <div class="modal-actions">
                <button class="btn-secondary" >Cancelar</button>
                <button class="btn-danger" id="modal-confirm-button">Excluir</button>
            </div>
        </div>
    </div>

    <script type="module" src="./js/main.js"></script>
    <script type="module" src="./js/ui.js"></script>
</body>
</html>
