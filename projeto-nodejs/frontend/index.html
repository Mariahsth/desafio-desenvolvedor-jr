<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Gerenciador de Tarefas</h1>

        <div class="add-task">
            <label for="taskInput">Nova Tarefa:</label>
            <input type="text" id="taskInput" placeholder="Digite uma nova tarefa...">
            <label for="dueDateInput">Prazo de conclusão:</label>
            <input type="date" id="dueDateInput" title="Prazo da tarefa">
            <button onclick="addTask()">Adicionar</button>
        </div>

        <div class="filters">
            <h3>Filtrar por:</h3>
            <label for="filterStart">Data início:</label>
            <input type="date" id="filterStart">
            <label for="filterEnd">Data fim:</label>
            <input type="date" id="filterEnd">
            <label for="searchTitle">Pesquisar título:</label>
            <input type="text" id="searchTitle" placeholder="Pesquisar por título...">
            <button onclick="applyFilters()">Aplicar filtros</button>
            <button onclick="clearFilters()">Limpar filtros</button>
        </div>

        <div class="task-list">
            <h2>Ativas</h2>
            <ul id="tasksListActive"></ul>
        </div>

        <div class="task-list">
            <h2>Concluídas</h2>
            <ul id="tasksListCompleted"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
